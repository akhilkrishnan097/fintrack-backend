name: Backend Build With Maven

on: push

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Validate commit title
        shell: bash
        run: |
          message=$(git log -1 --format=%s)
          pattern='^(feat|chore|refactor|fix|perf|docs)(\([^()[:space:]]+\))?: [^[:space:]].*$'

          if [[ ! "$message" =~ $pattern ]]; then
            echo "Invalid commit title."
            echo "Expected: <type>: <message> or <type>(<scope>): <message>"
            echo "Allowed types: feat, chore, refactor, fix, perf, docs"
            exit 1
          fi
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
